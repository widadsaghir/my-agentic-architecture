<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <!-- Arrière-plan Dark Profond Haute Couture (Zéro Carreaux / Zéro Tofu) -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="45%" stop-color="#080F24" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Halos lumineux diffus et soyeux (Bleu Cyan, Indigo, Vert Émeraude) -->
    <radialGradient id="glowCyan" cx="12%" cy="12%" r="55%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.30" />
      <stop offset="100%" stop-color="#080F24" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowIndigo" cx="50%" cy="18%" r="50%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#080F24" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowEmerald" cx="88%" cy="85%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.20" />
      <stop offset="100%" stop-color="#080F24" stop-opacity="0" />
    </radialGradient>

    <!-- Cartes Glassmorphism professionnelles -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#070B18" stop-opacity="0.95" />
    </linearGradient>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.75" />
    </filter>
  </defs>

  <style>
    .title { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 800; fill: #FFFFFF; font-size: 38px; letter-spacing: -0.5px; }
    .subtitle { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 400; fill: #94A3B8; font-size: 16.5px; }
    .badge-text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 11.5px; letter-spacing: 1px; }
    .card-title { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 17px; letter-spacing: 0.3px; }
    .card-tech { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 13px; }
    .card-body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 400; font-size: 13.5px; fill: #E2E8F0; }
    .footer-text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 12.5px; }
  </style>

  <!-- Arrière-plan Dark Pur (Sans Grille / Sans Carreaux) -->
  <rect width="1280" height="640" fill="url(#bgGradient)" />
  <rect width="1280" height="640" fill="url(#glowCyan)" />
  <rect width="1280" height="640" fill="url(#glowIndigo)" />
  <rect width="1280" height="640" fill="url(#glowEmerald)" />

  <!-- EN-TÊTE / HEADER -->
  <g transform="translate(60, 48)">
    <!-- Capsule de statut / Tag -->
    <rect x="0" y="0" width="410" height="28" rx="14" fill="#0B1226" stroke="#38BDF8" stroke-width="1.2" stroke-opacity="0.85" />
    <circle cx="14" cy="14" r="5" fill="#38BDF8" />
    <text x="28" y="18" fill="#38BDF8" class="badge-text">BRIGADE D'AGENTS IA • ARCHITECTURE D'ENTREPRISE</text>

    <!-- Titre Principal -->
    <text x="0" y="70" class="title">my-agentic-architecture</text>
    
    <!-- Sous-titre Exécutif -->
    <text x="0" y="100" class="subtitle">La Brigade d'Architecture Augmentée (AAP) • Flotte de 23 Agents Spécialisés • Conseil des Grands Maîtres</text>
  </g>

  <!-- CARTES BENTO D'ARCHITECTURE (3 COLONNES) -->

  <!-- CARTE 1 : ORCHESTRATION & FLOTTE DE 23 AGENTS -->
  <g transform="translate(60, 180)" filter="url(#cardShadow)">
    <rect width="365" height="340" rx="16" fill="url(#cardGrad)" stroke="#0284C7" stroke-width="1.5" stroke-opacity="0.8" />
    <rect width="365" height="5" rx="2" fill="#0284C7" />
    
    <!-- Badge Catégorie -->
    <rect x="24" y="22" width="205" height="24" rx="6" fill="#0369A1" fill-opacity="0.45" stroke="#38BDF8" stroke-width="1" />
    <text x="34" y="38" fill="#7DD3FC" class="badge-text">ORCHESTRATION MULTI-AGENTS</text>

    <text x="24" y="75" fill="#FFFFFF" class="card-title">Flotte de 23 Agents IA</text>
    <text x="24" y="96" fill="#38BDF8" class="card-tech">4 Modes CLI • Autonomous Feedback Loops</text>

    <!-- Lignes de contenu avec puces dessinées -->
    <g transform="translate(24, 125)">
      <!-- Item 1 -->
      <circle cx="6" cy="6" r="3.5" fill="#0284C7" />
      <text x="18" y="10" class="card-body"><tspan font-weight="700" fill="#FFFFFF">Rôles Dédiés :</tspan> Cadrage, C4, Threat Model</text>
      <text x="18" y="28" fill="#94A3B8" font-size="12px">FinOps, NFRs et Fitness Functions ciblées</text>

      <!-- Item 2 -->
      <circle cx="6" cy="56" r="3.5" fill="#0284C7" />
      <text x="18" y="60" class="card-body"><tspan font-weight="700" fill="#FFFFFF">Boucle Rebouclage :</tspan> Self-Correction</text>
      <text x="18" y="78" fill="#94A3B8" font-size="12px">Cycles itératifs jusqu'au consensus d'excellence</text>

      <!-- Item 3 -->
      <circle cx="6" cy="106" r="3.5" fill="#0284C7" />
      <text x="18" y="110" class="card-body"><tspan font-weight="700" fill="#FFFFFF">Tri-Formats :</tspan> Synchronisation continue</text>
      <text x="18" y="128" fill="#94A3B8" font-size="12px">PlantUML (.puml), Mermaid (.mmd) &amp; Draw.io</text>

      <!-- Item 4 -->
      <circle cx="6" cy="156" r="3.5" fill="#0284C7" />
      <text x="18" y="160" class="card-body"><tspan font-weight="700" fill="#FFFFFF">RAG Souverain :</tspan> Indexation technique</text>
      <text x="18" y="178" fill="#94A3B8" font-size="12px">Matrices Excel, BPMN et living docs unifiées</text>
    </g>
  </g>

  <!-- CARTE 2 : CONSEIL DES GRANDS MAÎTRES & GOUVERNANCE -->
  <g transform="translate(458, 180)" filter="url(#cardShadow)">
    <rect width="365" height="340" rx="16" fill="url(#cardGrad)" stroke="#6366F1" stroke-width="1.5" stroke-opacity="0.8" />
    <rect width="365" height="5" rx="2" fill="#6366F1" />

    <!-- Badge Catégorie -->
    <rect x="24" y="22" width="185" height="24" rx="6" fill="#4338CA" fill-opacity="0.45" stroke="#818CF8" stroke-width="1" />
    <text x="34" y="38" fill="#A5B4FC" class="badge-text">GOUVERNANCE EXPERTE</text>

    <text x="24" y="75" fill="#FFFFFF" class="card-title">Conseil des 5 Maîtres</text>
    <text x="24" y="96" fill="#A5B4FC" class="card-tech">Fowler • Martin • Vogels • Cockburn • Newman</text>

    <g transform="translate(24, 125)">
      <!-- Item 1 -->
      <circle cx="6" cy="6" r="3.5" fill="#6366F1" />
      <text x="18" y="10" class="card-body"><tspan font-weight="700" fill="#FFFFFF">Fowler &amp; Uncle Bob :</tspan> Clean Architecture</text>
      <text x="18" y="28" fill="#94A3B8" font-size="12px">Patterns d'entreprise, SOLID et refactoring continu</text>

      <!-- Item 2 -->
      <circle cx="6" cy="56" r="3.5" fill="#6366F1" />
      <text x="18" y="60" class="card-body"><tspan font-weight="700" fill="#FFFFFF">Werner Vogels :</tspan> Cloud Resilience</text>
      <text x="18" y="78" fill="#94A3B8" font-size="12px">Design for Failure, asynchronisme &amp; haute dispo</text>

      <!-- Item 3 -->
      <circle cx="6" cy="106" r="3.5" fill="#6366F1" />
      <text x="18" y="110" class="card-body"><tspan font-weight="700" fill="#FFFFFF">Cockburn &amp; Newman :</tspan> Découplage Bounded</text>
      <text x="18" y="128" fill="#94A3B8" font-size="12px">Ports &amp; Adapters, Strangler Fig et Domain Events</text>

      <!-- Item 4 -->
      <circle cx="6" cy="156" r="3.5" fill="#6366F1" />
      <text x="18" y="160" class="card-body"><tspan font-weight="700" fill="#FFFFFF">Scoring Qualité :</tspan> 5 dimensions d'audit</text>
      <text x="18" y="178" fill="#94A3B8" font-size="12px">Traçabilité RTM, couplage &amp; Cloud Readiness</text>
    </g>
  </g>

  <!-- CARTE 3 : CRAFTSMANSHIP & ZERO-TRUST -->
  <g transform="translate(855, 180)" filter="url(#cardShadow)">
    <rect width="365" height="340" rx="16" fill="url(#cardGrad)" stroke="#10B981" stroke-width="1.5" stroke-opacity="0.8" />
    <rect width="365" height="5" rx="2" fill="#10B981" />

    <!-- Badge Catégorie -->
    <rect x="24" y="22" width="200" height="24" rx="6" fill="#065F46" fill-opacity="0.45" stroke="#34D399" stroke-width="1" />
    <text x="34" y="38" fill="#6EE7B7" class="badge-text">CRAFTSMANSHIP &amp; ZERO-TRUST</text>

    <text x="24" y="75" fill="#FFFFFF" class="card-title">Test-Driven Development</text>
    <text x="24" y="96" fill="#6EE7B7" class="card-tech">Pure Hexagonal Domain • 0 Token Cost Gates</text>

    <g transform="translate(24, 125)">
      <!-- Item 1 -->
      <circle cx="6" cy="6" r="3.5" fill="#10B981" />
      <text x="18" y="10" class="card-body"><tspan font-weight="700" fill="#FFFFFF">65 Tests TDD :</tspan> 100% au vert en local</text>
      <text x="18" y="28" fill="#94A3B8" font-size="12px">Vérification déterministe en &lt; 2 secondes</text>

      <!-- Item 2 -->
      <circle cx="6" cy="56" r="3.5" fill="#10B981" />
      <text x="18" y="60" class="card-body"><tspan font-weight="700" fill="#FFFFFF">Sas Zero-Trust :</tspan> Air-Gap Anonymizer</text>
      <text x="18" y="78" fill="#94A3B8" font-size="12px">Masquage déterministe RFC 1918 à 0 Token</text>

      <!-- Item 3 -->
      <circle cx="6" cy="106" r="3.5" fill="#10B981" />
      <text x="18" y="110" class="card-body"><tspan font-weight="700" fill="#FFFFFF">Frameworks :</tspan> TOGAF 10 &amp; SAFe 6</text>
      <text x="18" y="128" fill="#94A3B8" font-size="12px">Conformité aux standards d'architecture d'élite</text>

      <!-- Item 4 -->
      <circle cx="6" cy="156" r="3.5" fill="#10B981" />
      <text x="18" y="160" class="card-body"><tspan font-weight="700" fill="#FFFFFF">Open Source :</tspan> GitHub Public Blueprint</text>
      <text x="18" y="178" fill="#94A3B8" font-size="12px">Licence Apache 2.0 pour la communauté</text>
    </g>
  </g>

  <!-- BANDEAU INFÉRIEUR / FOOTER KPI BADGES (SANS TOFU / PUCES DESSINÉES AU COMPAS) -->
  <g transform="translate(60, 545)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="185" height="36" rx="8" fill="#0B1226" stroke="#1E293B" stroke-width="1" />
    <circle cx="20" cy="18" r="4.5" fill="#38BDF8" />
    <text x="34" y="23" fill="#38BDF8" class="footer-text">23 Agents Spécialisés</text>

    <!-- Pill 2 -->
    <rect x="200" y="0" width="185" height="36" rx="8" fill="#0B1226" stroke="#1E293B" stroke-width="1" />
    <circle cx="20" cy="18" r="4.5" fill="#34D399" />
    <text x="34" y="23" fill="#34D399" class="footer-text">65/65 Tests TDD Verts</text>

    <!-- Pill 3 -->
    <rect x="400" y="0" width="185" height="36" rx="8" fill="#0B1226" stroke="#1E293B" stroke-width="1" />
    <circle cx="20" cy="18" r="4.5" fill="#A5B4FC" />
    <text x="34" y="23" fill="#A5B4FC" class="footer-text">TOGAF 10 &amp; SAFe 6</text>

    <!-- Pill 4 -->
    <rect x="600" y="0" width="180" height="36" rx="8" fill="#0B1226" stroke="#1E293B" stroke-width="1" />
    <circle cx="20" cy="18" r="4.5" fill="#FBBF24" />
    <text x="34" y="23" fill="#FBBF24" class="footer-text">Apache 2.0 Open Source</text>

    <!-- Signature Auteur -->
    <g transform="translate(805, 0)">
      <rect x="0" y="0" width="355" height="36" rx="8" fill="#0B1226" stroke="#0284C7" stroke-width="1.2" stroke-opacity="0.85" />
      <circle cx="20" cy="18" r="4.5" fill="#38BDF8" />
      <text x="34" y="23" fill="#7DD3FC" class="footer-text">Widad SAGHIR • Lead Enterprise Architect</text>
    </g>
  </g>
</svg>