stages:
  - test

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  GEMINI_API_KEY: "ci-dummy-key-for-testing"

cache:
  paths:
    - .cache/pip

test:
  stage: test
  image: python:3.13-slim
  before_script:
    - python -m pip install --upgrade pip
    - pip install -r requirements.txt
  script:
    - pytest tests/ -v --tb=short
